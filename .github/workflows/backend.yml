name: Backend

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      # The backend's tests decode the frontend's pinned requests
      - "frontend/.golden/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      # The backend's tests decode the frontend's pinned requests
      - "frontend/.golden/**"
      - ".github/workflows/backend.yml"

# Only the latest push to a branch needs checking
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      GHC_VERSION: "9.12.4"
    steps:
      - uses: actions/checkout@v4
      # The runner image doesn't ship this GHC, and installing it takes
      # ~3 minutes, so keep the installed compiler between runs
      - uses: actions/cache@v4
        with:
          path: /usr/local/.ghcup/ghc/${{ env.GHC_VERSION }}
          key: ghc-${{ runner.os }}-${{ env.GHC_VERSION }}
      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: "3.16.1.0"
      - run: cabal update
      # The compiler setup found, by path: a cached GHC has no ghc-9.12.4
      # link for cabal.project's with-compiler to find
      - run: cabal build all --dry-run -w "${{ steps.setup.outputs.ghc-exe }}"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-${{ hashFiles('backend/dist-newstyle/cache/plan.json') }}
          restore-keys: cabal-
      - run: cabal build all -w "${{ steps.setup.outputs.ghc-exe }}"
      - run: cabal test -w "${{ steps.setup.outputs.ghc-exe }}"

  fourmolu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same version as mise.toml, with backend/fourmolu.yaml
      - uses: haskell-actions/run-fourmolu@v13
        with:
          version: "0.21.0.0"
          working-directory: backend
          pattern: |
            src/**/*.hs
            app/**/*.hs
            test/**/*.hs

  hlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/hlint-setup@v2
        with:
          version: "3.10"
      - uses: haskell-actions/hlint-run@v2
        with:
          path: '["backend/src/", "backend/app/", "backend/test/"]'
          fail-on: suggestion

name: CI

on:
  push:
    branches: [master]
  pull_request:

# Only the latest push to a branch needs checking
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: "9.4.8"
          cabal-version: "3.16.1.0"
      - run: cabal update
      - run: cabal build all --dry-run
      - uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-${{ hashFiles('backend/dist-newstyle/cache/plan.json') }}
          restore-keys: cabal-
      - run: cabal build all
      - run: cabal test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            frontend/.spago
            frontend/output
          key: spago-${{ hashFiles('frontend/spago.lock') }}
      - run: npx spago test
      - run: npx spago bundle

name: Frontend

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      # The frontend's tests decode the backend's golden JSON
      - "backend/.golden/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      # The frontend's tests decode the backend's golden JSON
      - "backend/.golden/**"
      - ".github/workflows/frontend.yml"

# Only the latest push to a branch needs checking
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # The version mise.toml pins, as in development and the Docker build
      - id: versions
        run: echo "node=$(../scripts/tool-version node)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            frontend/.spago
            frontend/output
          key: spago-${{ hashFiles('frontend/spago.lock') }}
      - run: npx purs-tidy check "src/**/*.purs" "test/**/*.purs"
      - run: npx spago test
      - run: npx spago bundle
